name: Build core binaries

# Fork-specific: compile the xray core binary only (no geodat, no wintun, no
# android/other bundles). Emits linux/arm64 and linux/amd64.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ''
          - goos: linux
            goarch: arm64
            ext: ''
          - goos: windows
            goarch: amd64
            ext: '.exe'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # A range, not a pin: setup-go fetches actions/go-versions@main live
          # (no bundled manifest, no cache layer) and that list is ordered
          # descending, so tool-cache's _findMatch returns the first match --
          # i.e. the newest 1.27.x. That is what we want here: patch releases
          # carry security fixes, and this is a proxy that verifies TLS.
          # The tradeoff is that a commit is not bit-for-bit reproducible; the
          # "Record Go version" step below makes each build's toolchain visible.
          go-version: '1.27.x'
          check-latest: true
          cache: false

      - name: Record Go version
        run: |
          echo "Go toolchain: $(go version)" >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          go build -trimpath \
            -ldflags "-s -w -buildid=" \
            -o "xray-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}" \
            ./main

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xray-${{ matrix.goos }}-${{ matrix.goarch }}
          path: xray-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
          if-no-files-found: error

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            "xray-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}" \
            --clobber

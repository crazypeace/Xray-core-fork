name: Build core binaries

# Fork-specific: compile the xray core binary only (no geodat, no wintun, no
# android/other bundles). Emits linux/arm64 and linux/amd64.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build linux/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            ext: ''
          - goarch: arm64
            ext: ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          check-latest: true
          cache: false

      - name: Build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          go build -trimpath \
            -ldflags "-s -w -buildid=" \
            -o "xray-linux-${{ matrix.goarch }}" \
            ./main

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xray-linux-${{ matrix.goarch }}
          path: xray-linux-${{ matrix.goarch }}
          if-no-files-found: error

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            "xray-linux-${{ matrix.goarch }}" \
            --clobber
